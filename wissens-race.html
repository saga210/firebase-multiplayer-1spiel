ont-weight:950;letter-spacing:.15em;color:var(--cyan);margin:10px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:24px 0}.player{background:#0003;border-radius:17px;padding:14px;text-align:center}.gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.timer{font-size:30px;font-weight:950;color:var(--cyan)}.timer.low{color:#f87171}.bar{height:10px;background:#ffffff18;border-radius:20px;overflow:hidden;margin-bottom:18px}.bar>div{height:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width .3s}.question{font-size:clamp(24px,4vw,36px);font-weight:900;text-align:center;min-height:120px;display:grid;place-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.answer{border-radius:16px;padding:18px;text-align:left;font-weight:750;font-size:17px}.answer:hover{background:#ffffff25}.answer:disabled{cursor:default}.answer.correct{background:#10b981;color:#07111f}.answer.wrong{background:#ef4444}.answer .letter{opacity:.6;margin-right:10px}.feedback{background:#0003;border-radius:16px;padding:16px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.rankrow{display:flex;align-items:center;gap:12px;background:#0003;border-radius:13px;padding:11px;margin-top:10px}.rankrow .avatar{font-size:30px}.rankrow .clothes{font-size:20px}.rankrow .hair{font-size:14px}.score{color:var(--cyan);font-size:13px}footer{text-align:center;color:#94a3b8;font-size:12px;margin:28px 0 6px}.hidden{display:none!important}.small{font-size:13px}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    try {
      const result = await signInAnonymously(auth);
      console.log("Anonymous login ok", result.user.uid);
    } catch (error) {
      console.error("Anonymous login failed", error);

  } else {
    authReady = true;
    console.log("Firebase user ready:", user.uid);
    if (me.id !== user.uid) {
      me = { ...me, id: user.uid };

async function ensureAuth() {
  if (!auth.currentUser) {
    const result = await signInAnonymously(auth);
    me = { ...me, id: result.user.uid };
    return result.user;
  }
  me = { ...me, id: auth.currentUser.uid };
  return auth.currentUser;
}

const ANIMALS=["🦊","🐼","🐯","🐸","🐨","🦁","🐰","🐵"], HAIR=["✨","🟤","🟡","🟣","🔵"], CLOTHES=["👕","🧥","🥋","👗","🦺"], ACCESSORIES=["🚲","🛹","☁️","Ohne"];
const uid=()=>Math.random().toString(36).slice(2,10), roomCode=()=>String(Math.floor(100000+Math.random()*900000)), shuffle=a=>[...a].sort(()=>Math.random()-.5);
const $=id=>document.getElementById(id);

let screen="home", name="", code="", host=false, room=null, players=[], round=0, selected=null, locked=false, time=15, answers={}, timer=null, startAt=0;
let me={id:uid(),name:"",animal:"🦊",hair:"✨",clothes:"👕",accessory:"Ohne",score:0};
let roomRef=null, playersRef=null, roomListener=null, playersListener=null;

const appElement=$("app");

function avatar(p,large=false){return `<div class="avatar"><span class="hair">${p.hair||"✨"}</span><span>${p.animal||"🦊"}</span><span class="clothes">${p.clothes||"👕"}</span>${p.accessory&&p.accessory!=="Ohne"?`<span>${p.accessory}</span>`:""}</div>`}
function btn(text,action,disabled=false,ghost=false){return `<button class="btn ${ghost?"ghost":""}" data-action="${action}" ${disabled?"disabled":""}>${text}</button>`}

function render(){
if(screen==="home"){appElement.innerHTML=`<div class="layout"><section class="panel"><h2>Dein Quiz-Tier</h2><p class="muted">Gestalte deine Figur und betrete die Arena.</p><div class="avatarbox">${avatar(me,true)}</div><label>Spielername</label><input id="name" class="field" placeholder="Dein Name" value="${esc(name)}"><label>Tiergesicht</label><div class="options">${ANIMALS.map(x=>pick("animal",x)).join("")}</div><label>Haare / Effekt</label><div class="options">${HAIR.map(x=>pick("hair",x)).join("")}</div><label>Kleidung</label><div class="options">${CLOTHES.map(x=>pick("clothes",x)).join("")}</div><label>Accessoire</label><div class="options">${ACCESSORIES.map(x=>pick("accessory",x)).join("")}</div></section><section class="stack"><div class="panel"><h2>👑 Neuen Raum eröffnen</h2><p class="muted">Du leitest das Spiel und startest 15 zufällige Fragen aus dem 50er-Pool.</p>${btn("Raum erstellen","create")}</div><div class="panel"><h2>↪ Mit Code beitreten</h2><input id="code" class="field center" maxlength="6" inputmode="numeric" placeholder="6-stelliger Raumcode" value="${esc(code)}"><div>${btn("Beitreten","join",code.length!==6)}</div></div></section></div>`}
if(screen==="lobby"){appElement.innerHTML=`<section class="panel center"><div class="muted">Raumcode</div><div class="roomcode">${room.code}</div><button class="pill" data-action="copy">▢ Code kopieren</button><h2 style="margin-top:30px">Spieler in der Lobby (${players.length})</h2><div class="players">${players.map(p=>`<div class="player">${avatar(p)}<b>${esc(p.name)}</b></div>`).join("")}</div>${host?btn("▶ Spiel starten","start"): `<p style="color:#fde68a">Der Gastgeber startet gleich…</p>`}</section>`}
if(screen==="game"){const q=room?.questions?.[round];if(!q){screen="result";render();return}const ranking=[...players].sort((a,b)=>b.score-a.score);appElement.innerHTML=`<div class="gamegrid"><section><div class="topline"><span class="pill">Frage ${round+1}/${room.questions.length} · ${q.d}</span><span class="timer ${time<=5?"low":""}">${time}s</span></div><div class="bar"><div style="width:${time/15*100}%"></div></div><div class="panel"><div class="question">${q.q}</div><div class="answers">${q.a.map((x,i)=>`<button class="answer ${locked&&i===q.c?"correct":locked&&selected===i?"wrong":""}" data-answer="${i}" ${locked?"disabled":""}><span class="letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join("")}</div>${locked?`<div class="feedback"><div>${avatar(me)}<b>${selected===q.c?"Richtig! 🎉":"Richtig ist: "+q.a[q.c]}</b><div class="muted small">Warte auf die Mitspieler.</div></div>${host?`<div>${btn("Punkte berechnen","score",false,true)} ${btn("Weiter","next")}</div>`:""}</div>`:""}</div></section><aside class="panel"><h2>🏆 Rangliste</h2>${ranking.map((p,i)=>`<div class="rankrow"><b>${i+1}</b>${avatar(p)}<div><b>${esc(p.name)}</b><div class="score">${p.score} Punkte</div></div></div>`).join("")}</aside></div>`}
if(screen==="result"){const ranking=[...players].sort((a,b)=>b.score-a.score),winner=ranking[0]||me;appElement.innerHTML=`<section class="panel center"><div style="font-size:52px">🏆</div><h2 style="font-size:38px">Das Rennen ist beendet!</h2><div class="avatarbox" style="display:inline-block">${avatar(winner)}</div><h2 style="color:#fde047">${esc(winner.name||"Niemand")} gewinnt mit ${winner.score||0} Punkten!</h2><div style="max-width:600px;margin:20px auto">${ranking.map((p,i)=>`<div class="rankrow"><b>#${i+1}</b>${avatar(p)}<b style="flex:1;text-align:left">${esc(p.name)}</b><b>${p.score}</b></div>`).join("")}</div>${btn("↻ Neues Spiel","reload")}</section>`}
}

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pick(key,x){return `<button class="choice ${me[key]===x?"active":""}" data-pick="${key}" data-value="${x}">${x}</button>`}

function listenToRoom(rc){
  roomRef=ref(database,"rooms/"+rc);
  if(roomListener)roomListener();
  roomListener=onValue(roomRef,(snapshot)=>{
    if(snapshot.exists()){
      const data=snapshot.val();
      room={...data,code:rc};
      if(data.status==="game"&&screen==="lobby")screen="game";
      if(data.status==="result"&&screen==="game"){screen="result";clearInterval(timer)}
      render();
    }
  });
  playersRef=ref(database,"rooms/"+rc+"/players");
  if(playersListener)playersListener();
  playersListener=onValue(playersRef,(snapshot)=>{
    if(snapshot.exists()){
      const obj=snapshot.val();
      players=Object.keys(obj).map(k=>obj[k]);
      render();
    }else{
      players=[];
    }
  });
}

async function create(){
  if (!auth.currentUser) {
    await ensureAuth();
  }
  name=$("name").value.trim();
  me={...me, id: auth.currentUser.uid, name:name||"Spieler 1"};
  host=true;
  const rc=roomCode();
  code=rc;
  const questions=shuffle(QUESTIONS).slice(0,15);
  room={code:rc,status:"lobby",questions,round:0};
  const roomData={status:"lobby",code:rc,round:0,questions,hostId:me.id};
  await set(ref(database,"rooms/"+rc),roomData);
  await set(ref(database,"rooms/"+rc+"/players/"+me.id),me);
  listenToRoom(rc);
  screen="lobby";
  render();
}

async function join(){
  if (!auth.currentUser) {
    await ensureAuth();
  }
  name=$("name")?.value.trim()||name;
  code=$("code").value.trim();
  me={...me, id: auth.currentUser.uid, name:name||"Gast"};
  host=false;
  const snapshot=await get(child(ref(database),"rooms/"+code));
  if(snapshot.exists()){
    const data=snapshot.val();
    room={...data,code};
    await set(ref(database,"rooms/"+code+"/players/"+me.id),me);
    listenToRoom(code);
    screen="lobby";
    render();
  }else{
    alert("Raum nicht gefunden!");
  }
}

async function start(){
  if(!host)return;
  room={...room,status:"game"};
  await update(ref(database,"rooms/"+code),{status:"game"});
  screen="game";
  round=0;
  time=15;
  locked=false;
  answers={};
  startAt=Date.now();
  runTimer();
  render();
}

function runTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(screen!=="game"||locked){clearInterval(timer);return}
    time--;
    if(time<=0){time=0;submit(-1);clearInterval(timer)}
    render();
  },1000);
}

async function submit(i){
  if(locked)return;
  selected=i;
  locked=true;
  clearInterval(timer);
  const q=room.questions[round];
  const elapsed=Math.min(15000,Date.now()-startAt);
  const payload={id:me.id,index:i,elapsed,correct:i===q.c};
  answers[me.id]=payload;
  await set(ref(database,"rooms/"+code+"/answers/"+me.id),payload);
  render();
}

async function scoreRound(){
  const correct=Object.values(answers).filter(x=>x.correct).sort((a,b)=>a.elapsed-b.elapsed);
  const bonus=[1000,700,500];
  const updated=players.map(p=>{
    const rank=correct.findIndex(x=>x.id===p.id);
    return {...p,score:p.score+(rank>=0?(bonus[rank]||250)+Math.max(0,Math.round((15000-correct[rank].elapsed)/50)):0)};
  });
  for(const p of updated){
    await update(ref(database,"rooms/"+code+"/players/"+p.id),{score:p.score});
  }
  players=updated;
  render();
}

async function next(){
  const done=round>=room.questions.length-1;
  if(done){
    await update(ref(database,"rooms/"+code),{status:"result"});
    screen="result";
    clearInterval(timer);
  }else{
    round++;
    selected=null;
    locked=false;
    answers={};
    time=15;
    startAt=Date.now();
    await update(ref(database,"rooms/"+code),{round});
    runTimer();
  }
  render();
}

appElement.addEventListener("input",e=>{
  if(e.target.id==="name")name=e.target.value;
  if(e.target.id==="code"){
    code=e.target.value.replace(/\D/g,"").slice(0,6);
    e.target.value=code;
    const b=appElement.querySelector('[data-action="join"]');
    if(b)b.disabled=code.length!==6;
  }
});

appElement.addEventListener("click",async e=>{
  const p=e.target.closest("[data-pick]");
  if(p){me[p.dataset.pick]=p.dataset.value;render();return}
  const a=e.target.closest("[data-answer]");
  if(a){submit(Number(a.dataset.answer));return}
  const b=e.target.closest("[data-action]");
  if(!b)return;
  switch(b.dataset.action){
    case"create":await create();break;
    case"join":await join();break;
    case"start":await start();break;
    case"score":await scoreRound();break;
    case"next":await next();break;
    case"reload":location.reload();break;
    case"copy":navigator.clipboard?.writeText(room.code).then(()=>{b.textContent="✓ Kopiert"}).catch(()=>{});break;
  }
});

render();
</script></body></html>
