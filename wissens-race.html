<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wissens-Race – Live Quiz Arena</title>
  <style>
    :root {
      color-scheme: dark;
      --bg1: #0b1023;
      --bg2: #151d38;
      --panel: rgba(15, 23, 42, 0.83);
      --panel-border: rgba(103, 232, 249, 0.25);
      --cyan: #67e8f9;
      --violet: #8b5cf6;
      --yellow: #facc15;
      --green: #34d399;
      --red: #fb7185;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --shadow: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #253266 0%, var(--bg1) 52%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .eyebrow {
      letter-spacing: 0.16em;
      font-size: 12px;
      color: var(--cyan);
      opacity: 0.9;
      margin-bottom: 6px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }

    .pill {
      background: rgba(139, 92, 246, 0.22);
      border: 1px solid rgba(139, 92, 246, 0.6);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
      opacity: 0.9;
      text-align: center;
    }

    #app {
      min-height: 560px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 26px;
    }

    .panel.center {
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    .muted {
      color: var(--muted);
      margin: 0 0 14px;
    }

    .avatarbox {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(103, 232, 249, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(103, 232, 249, 0.25);
      display: grid;
      place-items: center;
      position: relative;
      font-size: 52px;
      user-select: none;
    }

    .avatar.large {
      width: 160px;
      height: 160px;
      font-size: 76px;
    }

    .avatar .hair,
    .avatar .clothes {
      position: absolute;
      font-size: 24px;
    }

    .avatar .hair { top: 10px; }
    .avatar .clothes { bottom: 10px; }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .choice {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(103, 232, 249, 0.25);
      border-radius: 16px;
      color: var(--text);
      padding: 14px 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .choice:hover,
    .choice.active {
      border-color: var(--cyan);
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(103,232,249,0.2);
    }

    .field {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(103, 232, 249, 0.25);
      border-radius: 16px;
      color: var(--text);
      padding: 14px 16px;
      font-size: 1rem;
      margin: 12px 0 18px;
    }

    .btn,
    button {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #06101f;
      font-weight: 800;
      padding: 13px 18px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover, button:hover { transform: translateY(-1px); }
    .btn:disabled, button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn.ghost {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .roomcode {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--yellow);
      margin: 16px 0 24px;
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
    }

    .player-chip {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(103, 232, 249, 0.2);
      border-radius: 999px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .gamegrid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
      align-items: start;
    }

    .question-box {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(103, 232, 249, 0.22);
      border-radius: 22px;
      padding: 22px;
    }

    .badge {
      display: inline-block;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
      font-weight: 800;
      border-radius: 999px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    .question {
      font-size: clamp(1.3rem, 2.5vw, 2.3rem);
      line-height: 1.4;
      margin: 0 0 18px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid rgba(103, 232, 249, 0.18);
      border-radius: 18px;
      padding: 18px 14px;
      min-height: 82px;
      font-size: 1.02rem;
      text-align: left;
      cursor: pointer;
      font-weight: 700;
    }

    .answer-btn.disabled {
      opacity: 0.9;
      cursor: default;
    }

    .answer-btn.correct {
      border-color: rgba(52, 211, 153, 0.8);
      background: rgba(52, 211, 153, 0.12);
    }

    .answer-btn.wrong {
      border-color: rgba(251, 113, 133, 0.8);
      background: rgba(251, 113, 133, 0.12);
    }

    .scorebox {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(103, 232, 249, 0.22);
      border-radius: 22px;
      padding: 18px;
    }

    .timer {
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      font-weight: 900;
      color: var(--yellow);
      margin: 8px 0 18px;
    }

    .rank-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: grid;
      gap: 8px;
    }

    .rank-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(103, 232, 249, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .winner {
      font-size: 4rem;
      margin: 12px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 760px) {
      body { padding: 14px; }
      .layout, .gamegrid { grid-template-columns: 1fr; }
      .answers, .choice-grid { grid-template-columns: 1fr; }
      .panel { padding: 18px; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

      return String(s || "").replace(/[&<>"']/g, (c) => ({

        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

              <div class="muted">Aktive Spieler</div>
              <ul class="rank-list">
                ${ranking.slice(0, 6).map((p, idx) => `
                  <li class="rank-item">
                    <span>#${idx + 1} ${esc(p.name || "Spieler")}</span>
                    <strong>${Number(p.score || 0)}</strong>
                  </li>
                `).join("")}
              </ul>

              <div style="margin-top: 18px;">
                ${host ? btn("Runde bewerten", "score", false, true) : ""}
              </div>
            </aside>
          </div>
        `;
        return;
      }

      if (screen === "result") {
        const ranking = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
        const winner = ranking[0] || me;

        appElement.innerHTML = `
          <section class="panel center">
            <div class="winner">🏆</div>
            <h2>Ergebnis</h2>
            <div class="muted">Gewinner: <strong>${esc(winner.name || "Spieler")}</strong></div>

            <ul class="rank-list" style="max-width: 420px; margin: 20px auto 0;">
              ${ranking.map((p, idx) => `
                <li class="rank-item">
                  <span>#${idx + 1} ${esc(p.name || "Spieler")}</span>
                  <strong>${Number(p.score || 0)} Pkt.</strong>
                </li>
              `).join("")}
            </ul>

            <div class="toolbar" style="justify-content:center; margin-top: 22px;">
              ${btn("Neustart", "reload", false, false)}
            </div>
          </section>
        `;
      }
    }

    async function ensureAuth() {
      if (!auth.currentUser) {
        try {
          const result = await signInAnonymously(auth);
          me = { ...me, id: result.user.uid };
          return result.user;
        } catch (error) {
          console.error("Anonymous login failed", error);
          throw error;
        }
      }

      me = { ...me, id: auth.currentUser.uid };
      return auth.currentUser;
    }

    function listenToRoom(rc) {
      if (roomListener) roomListener();
      if (playersListener) playersListener();
      if (answersListener) answersListener();

      const roomRef = ref(database, "rooms/" + rc);
      roomListener = onValue(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          room = null;
          players = [];
          answers = {};
          render();
          return;
        }

        room = snapshot.val();
        room.code = rc;

        if (room.status === "game" && screen === "lobby") {
          screen = "game";
        }

        if (room.status === "result" && screen !== "result") {
          screen = "result";
        }

        if (screen === "game" && room.round !== undefined && room.round !== null) {
          currentRound = Number(room.round || 0);
        }

        if (screen === "game" && room.roundStartedAt) {
          startRoundClock();
        }

        render();
      });

      const playersRef = ref(database, "rooms/" + rc + "/players");
      playersListener = onValue(playersRef, (snapshot) => {
        if (snapshot.exists()) {
          players = Object.values(snapshot.val());
        } else {
          players = [];
        }
        render();
      });

      const answersRef = ref(database, "rooms/" + rc + "/answers");
      answersListener = onValue(answersRef, (snapshot) => {
        answers = snapshot.exists() ? snapshot.val() : {};
        render();
      });
    }

    async function createRoom() {
      try {
        await ensureAuth();

        const nameInput = $("name");
        name = (nameInput ? nameInput.value.trim() : "") || "Spieler 1";
        me = { ...me, id: auth.currentUser.uid, name, score: 0 };
        host = true;

        const rc = roomCode();
        roomCodeValue = rc;
        code = rc;
        const questions = shuffle(QUESTIONS).slice(0, 12);

        await set(ref(database, "rooms/" + rc), {
          code: rc,
          status: "lobby",
          round: 0,
          questions,
          hostId: me.id,
          createdAt: Date.now()
        });

        await set(ref(database, "rooms/" + rc + "/players/" + me.id), me);

        listenToRoom(rc);
        screen = "lobby";
        render();
      } catch (error) {
        console.error("createRoom failed", error);
        alert("Raum konnte nicht erstellt werden: " + error.message);
      }
    }

    async function joinRoom() {
      try {
        await ensureAuth();

        const nameInput = $("name");
        name = (nameInput ? nameInput.value.trim() : "") || "Gast";
        const enteredCode = $("code")?.value.trim() || "";
        roomCodeValue = String(enteredCode).replace(/\D/g, "").slice(0, 6);
        code = roomCodeValue;

        if (roomCodeValue.length !== 6) {
          alert("Bitte einen gültigen 6-stelligen Raumcode eingeben.");
          return;
        }

        me = { ...me, id: auth.currentUser.uid, name, score: 0 };
        host = false;

        const snapshot = await get(ref(database, "rooms/" + roomCodeValue));
        if (!snapshot.exists()) {
          alert("Raum nicht gefunden!");
          return;
        }

        await set(ref(database, "rooms/" + roomCodeValue + "/players/" + me.id), me);
        listenToRoom(roomCodeValue);
        screen = "lobby";
        render();
      } catch (error) {
        console.error("joinRoom failed", error);
        alert("Beitritt fehlgeschlagen: " + error.message);
      }
    }

    async function startGame() {
      if (!host || !roomCodeValue) return;

      const resetPlayers = {};
      players.forEach((p) => {
        resetPlayers[p.id] = { ...p, score: 0 };
      });

      await set(ref(database, "rooms/" + roomCodeValue + "/players"), resetPlayers);
      await set(ref(database, "rooms/" + roomCodeValue + "/answers"), {});
      await update(ref(database, "rooms/" + roomCodeValue), {
        status: "game",
        round: 0,
        roundStartedAt: Date.now(),
        startedAt: Date.now()
      });

      selectedAnswer = null;
      locked = false;
      roomRoundScored = false;
      currentRound = 0;
      timeLeft = 15;
      startRoundClock();
      screen = "game";
      render();
    }

    async function submitAnswer(index, timedOut = false) {
      if (!roomCodeValue || screen !== "game" || locked || !room) return;

      const q = getCurrentQuestion();
      if (!q) return;

      locked = true;
      selectedAnswer = index;

      const payload = {
        id: me.id,
        name: me.name || "Spieler",
        index,
        elapsed: Math.min(15000, Date.now() - (Number(room.roundStartedAt) || Date.now())),
        correct: Number(index) === Number(q.c),
        timedOut,
        answeredAt: Date.now()
      };

      await set(ref(database, "rooms/" + roomCodeValue + "/answers/" + me.id), payload);
      render();

      if (host) {
        await maybeFinalizeRound();
      }
    }

    async function scoreRound() {
      if (!host || !roomCodeValue) return;
      if (!players.length) return;

      const answerList = Object.values(answers || {});
      const correctList = answerList.filter((a) => !!a.correct).sort((a, b) => a.elapsed - b.elapsed);
      const bonus = [1000, 700, 500];

      const updatedPlayers = players.map((p) => {
        const entry = answerList.find((a) => a.id === p.id);
        const rank = correctList.findIndex((a) => a.id === p.id);
        const gain = entry
          ? rank >= 0
            ? (bonus[rank] || 250) + Math.max(0, Math.round((15000 - correctList[rank].elapsed) / 50))
            : 0
          : 0;

        return { ...p, score: (Number(p.score) || 0) + gain };
      });

      const playersMap = {};
      updatedPlayers.forEach((p) => { playersMap[p.id] = p; });
      await set(ref(database, "rooms/" + roomCodeValue + "/players"), playersMap);
      players = updatedPlayers;
      roomRoundScored = true;
      render();
    }

    async function maybeFinalizeRound() {
      if (!host || !roomCodeValue || roomRoundScored) return;
      const currentAnswers = Object.values(answers || {});
      const allAnswered = players.length > 0 && players.every((p) => !!currentAnswers.find((a) => a.id === p.id));

      if (timeLeft <= 0 || allAnswered) {
        await scoreRound();
        setTimeout(async () => {
          await nextRound();
        }, 1200);
      }
    }

    async function nextRound() {
      if (!host || !roomCodeValue) return;

      const nextIndex = Number(currentRound) + 1;
      const done = nextIndex >= (room?.questions?.length || 1);

      if (done) {
        await update(ref(database, "rooms/" + roomCodeValue), { status: "result" });
        screen = "result";
        clearInterval(timerId);
        render();
        return;
      }

      await set(ref(database, "rooms/" + roomCodeValue + "/answers"), {});
      await update(ref(database, "rooms/" + roomCodeValue), {
        round: nextIndex,
        roundStartedAt: Date.now(),
        status: "game"
      });

      selectedAnswer = null;
      locked = false;
      roomRoundScored = false;
      currentRound = nextIndex;
      timeLeft = 15;
      screen = "game";
      startRoundClock();
      render();
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        me = { ...me, id: user.uid };
      }
    });

    appElement.addEventListener("input", (e) => {
      if (e.target.id === "name") {
        name = e.target.value;
      }
      if (e.target.id === "code") {
        code = e.target.value.replace(/\D/g, "").slice(0, 6);
        e.target.value = code;
        const joinButton = appElement.querySelector('[data-action="join"]');
        if (joinButton) joinButton.disabled = code.length !== 6;
      }
    });

    appElement.addEventListener("click", async (e) => {
      const picked = e.target.closest("[data-pick]");
      if (picked) {
        const key = picked.dataset.pick;
        const value = picked.dataset.value;
        me[key] = value;
        render();
        return;
      }

      const answerButton = e.target.closest("[data-answer]");
      if (answerButton && screen === "game") {
        const index = Number(answerButton.dataset.answer);
        await submitAnswer(index, false);
        return;
      }

      const action = e.target.closest("[data-action]");
      if (!action) return;

      switch (action.dataset.action) {
        case "create":
          await createRoom();
          break;
        case "join":
          await joinRoom();
          break;
        case "start":
          await startGame();
          break;
        case "score":
          await scoreRound();
          break;
        case "reload":
          location.reload();
          break;
        case "copy":
          if (roomCodeValue) {
            navigator.clipboard?.writeText(roomCodeValue).then(() => {
              action.textContent = "✓ Kopiert";
            }).catch(() => {});
          }
          break;
      }
    });

    render();
  </script>
</body>
</html>
